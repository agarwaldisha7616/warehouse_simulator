# pyproject.toml
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warehouse-simulator"
version = "1.0.0"
description = "Smart Warehouse Robot Simulator — OpenEnv Environment"
authors = [{ name = "Emergent Behavior" }]
requires-python = ">=3.11"
dependencies = [
    "openenv-core>=0.1.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]