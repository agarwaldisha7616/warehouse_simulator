name: warehouse-simulator
version: "2.0.0"
description: "Smart Warehouse Robot Simulator — Multi-agent AI system for navigating a grid warehouse, picking packages, and delivering them under deadlines while avoiding collisions."
author: "Emergent Behavior"
tags:
  - openenv
  - warehouse
  - robotics
  - multi-agent
  - logistics

observation_space:
  robots: "Dict[str, Dict] — Dictionary of robot states, keyed by agent_id (e.g. robot_1). Contains 'pos' [x,y] and 'carrying_id'."
  packages: "List[dict] — id, position, deadline, delivered status"
  obstacles: "List[Tuple] — blocked grid cells"
  grid_size: "int — N of N×N grid"
  steps_remaining: "int — steps left in episode"
  message: "str — feedback from last action"

action_space:
  agent_id: "str — The robot executing the action (e.g. robot_1, robot_2)"
  direction: "str — up | down | left | right | none"
  action: "str — move | pick | deliver | move_to | no_op"

tasks:
  - id: easy
    name: "Easy Warehouse"
    description: "5x5 grid, 1 robot, 1 package, no obstacles. Test basic navigation and delivery."
    difficulty: easy
    expected_score_random: "0.2"

  - id: medium
    name: "Medium Warehouse"
    description: "10x10 grid, 2 robots, 3 packages, 5 obstacles. Test path optimization and basic task allocation."
    difficulty: medium
    expected_score_random: "0.05"

  - id: hard
    name: "Hard Warehouse"
    description: "15x15 grid, 3 robots, 5 packages, 15 obstacles. Requires advanced coordination and collision avoidance."
    difficulty: hard
    expected_score_random: "0.0"

delivery_zone: "[0, 0]"
